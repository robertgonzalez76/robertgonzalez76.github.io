<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d72c2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Circuit-board decorative lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <line x1="0" y1="80"  x2="300" y2="80"/>  <line x1="300" y1="80"  x2="300" y2="180"/> <line x1="300" y1="180" x2="600" y2="180"/>
    <line x1="600" y1="180" x2="600" y2="60"/> <line x1="600" y1="60"  x2="900" y2="60"/>  <line x1="900" y1="60"  x2="900" y2="200"/>
    <line x1="900" y1="200" x2="1200" y2="200"/>
    <line x1="150" y1="0"  x2="150" y2="80"/>
    <line x1="450" y1="180" x2="450" y2="300"/>
    <line x1="750" y1="0"  x2="750" y2="60"/>
    <line x1="1050" y1="200" x2="1050" y2="300"/>
  </g>
  <!-- Nodes -->
  <g fill="#ffffff" fill-opacity="0.15">
    <circle cx="300"  cy="80"  r="5"/>
    <circle cx="600"  cy="180" r="5"/>
    <circle cx="600"  cy="60"  r="5"/>
    <circle cx="900"  cy="60"  r="5"/>
    <circle cx="900"  cy="200" r="5"/>
    <circle cx="150"  cy="80"  r="5"/>
    <circle cx="450"  cy="180" r="5"/>
    <circle cx="750"  cy="60"  r="5"/>
    <circle cx="1050" cy="200" r="5"/>
  </g>
</svg>
